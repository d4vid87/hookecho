<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HookEcho mobile concept · interactive prototype</title>
<style>
:root{font:15px system-ui,sans-serif;color:#ecf2f8;background:#10151b;--panel:#171d25;--line:#303b48;--muted:#aab9c9;--blue:#3976ac}*{box-sizing:border-box}button,input{font:inherit}button{color:inherit;cursor:pointer}body{margin:0}.app{position:relative;max-width:520px;height:100dvh;min-height:0;margin:auto;overflow:hidden;background:#10191b}.map{position:absolute;inset:0;background:radial-gradient(ellipse at 45% 62%,#125735 0 11%,transparent 22%),radial-gradient(ellipse at 28% 48%,#806b1e 0 3%,transparent 8%),repeating-linear-gradient(18deg,transparent 0 49px,#42504c 50px,#42504c 51px,transparent 52px 84px),#101b21}.map:after{content:"Dallas       Fort Worth\A                                     Plano\A\A\A\A                                 Waxahachie";white-space:pre;position:absolute;left:12%;top:28%;font-size:15px;line-height:86px;color:#c8d3d7;text-shadow:1px 1px #111}.badge{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 12px);font-size:10px;letter-spacing:.1em;color:#a9bcc9;background:#121b22c9;padding:6px 9px;border-radius:9px}.head{position:absolute;top:calc(env(safe-area-inset-top) + 46px);left:12px;right:12px;display:flex;gap:8px}.head button,.play,.nav button{border:1px solid #344354;background:#1a2530;border-radius:14px;min-height:48px}.site{flex:1;text-align:left;padding:7px 13px}.site small{display:block;color:#b8c9d4;font-size:11px}.icon{width:49px;font-size:21px}.quick{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 162px);right:12px;display:flex;align-items:center;gap:8px}.quick button{border:1px solid #344354;background:#17222def;border-radius:12px;min-height:46px;padding:0 13px}.quick .fresh{margin-left:auto;padding:8px 10px;background:#15231e;border-radius:10px;color:#69d5a4;font-size:12px}.play{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 82px);left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:9px 14px}.play button{border:0;border-radius:100%;background:var(--blue);width:42px;height:42px;font-size:19px}.play input{flex:1;min-width:40px;accent-color:#66b7ee}.play span{font-size:12px;white-space:nowrap}.nav{position:absolute;bottom:0;left:0;right:0;padding:7px 12px calc(env(safe-area-inset-bottom) + 7px);background:#151b22;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line)}.nav button{border:0;background:none;border-radius:12px;color:#c2d0da;font-size:12px;min-height:58px}.nav button span{display:block;font-size:21px}.nav button.sel{background:#294e73;color:white}.shade{position:absolute;inset:0;background:#03080c8c;display:none}.shade.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);height:min(58dvh,590px);background:var(--panel);border:1px solid #39434e;border-radius:23px 23px 0 0;display:none;box-shadow:0 -20px 40px #0007}.sheet.show{display:flex;flex-direction:column}.sheet.expanded{height:calc(100dvh - env(safe-area-inset-top) - 116px)}.sheet header{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 18px;border-bottom:1px solid var(--line);font-size:19px;font-weight:650}.sheet header button{background:transparent;border:0;font-size:21px;width:45px;height:45px}.content{padding:16px 18px 24px;overflow:auto}.content h3{font-size:13px;color:var(--muted);font-weight:550;margin:22px 0 9px}.content h3:first-child{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid #2c3640;gap:10px}.row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.pillbar{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #3a4754;border-radius:10px;background:#222b35;padding:10px 13px;min-height:45px}.pill.sel{background:#315a82;border-color:#4979a5}.warning{padding:12px 0;border-bottom:1px solid var(--line)}.warning b{color:#f6bd53}.warning small{display:block;color:var(--muted);padding-top:3px}input[type=search]{width:100%;height:48px;border:1px solid #435161;border-radius:12px;background:#101820;color:#fff;padding:0 14px}.prototype{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 78px);left:12px;color:#b5c6d3;font-size:10px;background:#111a23ce;padding:5px 7px;border-radius:7px}.analyst{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 104px);left:12px;right:12px;gap:6px}.analyst.show{display:flex}.analyst button{background:#182938;border:1px solid #42607a;min-height:46px;padding:0 12px;border-radius:11px;flex:1}.analyst button.sel{background:#315a82}@media (orientation:landscape){.app{max-width:none}.sheet{left:auto;top:calc(env(safe-area-inset-top) + 10px);bottom:calc(env(safe-area-inset-bottom) + 75px);width:min(48vw,470px);height:auto;border-radius:20px}.sheet.expanded{height:auto}.quick{right:52%}.play{right:52%}.analyst{right:52%}}
</style>
<div class="app"><div class="map"></div><div class="badge">INTERACTIVE CONCEPT · REPRESENTATIVE WEATHER DATA</div><div class="head"><button class="site" onclick="openSheet('radar')">KFWS · Reflectivity<small>Dallas/Fort Worth · 0.5°</small></button><button class="icon" aria-label="Search" onclick="openSheet('search')">⌕</button><button class="icon" aria-label="Locations" onclick="openSheet('locations')">⌖</button></div><div class="analyst" id="analyst"><button class="sel" onclick="pane(1)">Pane 1</button><button onclick="pane(2)">Pane 2</button><button onclick="openSheet('analyst')">Layout</button></div><div class="quick"><button onclick="openSheet('radar')">REF ▾</button><button onclick="openSheet('layers')">Layers</button><span class="fresh">● Fresh · 2 min</span></div><div class="play"><button aria-label="Play or pause" onclick="this.textContent=this.textContent==='▶'?'Ⅱ':'▶'">▶</button><input aria-label="Radar time" type="range" min="0" max="100" value="80"><span>8:42 PM</span></div><div class="prototype">Tap a destination to explore the prototype</div><div class="shade" id="shade" onclick="closeSheet()"></div><section class="sheet" id="sheet" aria-label="Current menu"><header><span id="title"></span><div><button aria-label="Expand sheet" onclick="document.getElementById('sheet').classList.toggle('expanded')">⤢</button><button aria-label="Close sheet" onclick="closeSheet()">×</button></div></header><div class="content" id="content"></div></section><nav class="nav" aria-label="Mobile navigation"><button onclick="openSheet('radar')" data-page="radar"><span>◉</span>Radar</button><button onclick="openSheet('layers')" data-page="layers"><span>▧</span>Layers</button><button onclick="openSheet('alerts')" data-page="alerts"><span>♧</span>Alerts 8</button><button onclick="openSheet('more')" data-page="more"><span>☷</span>More</button></nav></div>
<script>
let current='',mode='radar',selectedDay=1,previewState='fresh';
const pages={radar:`<h3>RADAR SITE</h3><div class="row" onclick="openSheet('search')">KFWS · Dallas/Fort Worth <span>Change ›</span></div><h3>PRODUCT</h3><div class="pillbar"><button class="pill sel" onclick="pick(this)">Reflectivity</button><button class="pill" onclick="pick(this)">Velocity</button><button class="pill" onclick="openSheet('products')">More products</button></div><h3>DISPLAY</h3><div class="row">Tilt <button class="pill">0.5° ▾</button></div><div class="row">Threshold <button class="pill">16 dBZ ▾</button></div><details><summary class="row">Advanced product settings</summary><div class="row">Tint by precipitation type <input type="checkbox"></div></details>`,layers:`<h3>QUICK OVERLAYS</h3><div class="pillbar"><button class="pill" onclick="pick(this)">Storm tracks</button><button class="pill" onclick="pick(this)">MRMS</button><button class="pill" onclick="pick(this)">Storm attributes</button></div><h3>SPC CONVECTIVE OUTLOOK</h3><div class="pillbar"><button class="pill sel" onclick="day(this,1)">Day 1</button><button class="pill" onclick="day(this,2)">Day 2</button><button class="pill" onclick="day(this,3)">Day 3</button></div><h3>LAYER</h3><div class="pillbar"><button class="pill sel" onclick="pick(this)">Categorical</button><button class="pill" onclick="pick(this)">Tornado</button><button class="pill" onclick="pick(this)">Wind</button><button class="pill" onclick="pick(this)">Hail</button></div><p style="color:#bccbd3">🟢 TSTM　🟡 SLGT　🟠 ENH　🔴 MDT　🟣 HIGH</p>`,alerts:`<div class="row">Show warnings on map <input type="checkbox" checked></div><p style="color:#aab9c9">8 warnings in view · newest first</p><div class="warning" onclick="openSheet('warning')"><b>Severe Thunderstorm Warning</b><small>Dallas County · expires in 32 min</small></div><div class="warning" onclick="openSheet('warning')"><b>Tornado Warning</b><small>Johnson County · expires in 18 min</small></div><div class="warning" onclick="openSheet('warning')"><b>Flash Flood Warning</b><small>Tarrant County · expires in 51 min</small></div>`,warning:`<button class="pill" onclick="openSheet('alerts')">‹ All alerts</button><h3>Tornado Warning</h3><p>Representative bulletin content for prototype review.</p><div class="row">Johnson County <span>18 min left</span></div><button class="pill" onclick="closeSheet()">View on map</button>`,more:`<div class="row" onclick="enterAnalyst()">Open Analyst Workstation <span>›</span></div><div class="row" onclick="openSheet('locations')">Saved and custom locations <span>›</span></div><div class="row" onclick="openSheet('workspaces')">Workspaces <span>›</span></div><div class="row" onclick="openSheet('settings')">Settings <span>›</span></div><div class="row" onclick="openSheet('help')">Help and walkthrough <span>›</span></div><div class="row" onclick="openSheet('states')">Preview loading and alert states <span>›</span></div>`,states:`<button class="pill" onclick="openSheet('more')">‹ More</button><h3>RADAR STATE</h3><div class="pillbar"><button class="pill" onclick="setPreviewState('fresh')">Fresh</button><button class="pill" onclick="setPreviewState('loading')">Loading</button><button class="pill" onclick="setPreviewState('stale')">Stale</button><button class="pill" onclick="setPreviewState('offline')">Offline</button></div><h3>ALERTS</h3><button class="pill" onclick="setPreviewState('empty')">No alerts in view</button>`,analyst:`<button class="pill" onclick="exitAnalyst()">← Back to Radar</button><h3>PRESETS</h3><div class="pillbar"><button class="pill">Tornado</button><button class="pill">Hail</button><button class="pill">Mesoscale</button><button class="pill">Forecast</button></div><h3>LAYOUT</h3><div class="row">Pane count <button class="pill">2 ▾</button></div><div class="row">Link maps <input type="checkbox" checked></div><div class="row">Link time <input type="checkbox" checked></div><div class="row" onclick="openSheet('inspector')">Inspector <span>›</span></div>`,search:`<input type="search" aria-label="Search HookEcho" placeholder="Search places, sites, products, tools…"><h3>PLACES</h3><div class="row" onclick="closeSheet()">Dallas, TX <span>›</span></div><h3>RADAR SITES</h3><div class="row" onclick="closeSheet()">KFWS · Dallas/Fort Worth <span>›</span></div><h3>PRODUCTS</h3><div class="row" onclick="closeSheet()">Reflectivity <span>›</span></div>`,locations:`<button class="pill" onclick="openSheet('more')">‹ More</button><h3>CUSTOM LOCATIONS</h3><div class="row">Add location <span>＋</span></div>`,products:`<button class="pill" onclick="openSheet('radar')">‹ Radar</button><div class="row">Storm relative velocity</div><div class="row">Correlation coefficient</div><div class="row">Spectrum width</div>`,workspaces:`<button class="pill" onclick="openSheet('more')">‹ More</button><div class="row">Chase</div><div class="row">National overview</div><div class="row">Analysis</div>`,settings:`<button class="pill" onclick="openSheet('more')">‹ More</button><h3>SETTINGS</h3><div class="row">Palette</div><div class="row">Units</div><div class="row">Map</div>`,help:`<button class="pill" onclick="openSheet('more')">‹ More</button><p>Start with Radar, add Layers, and open Alerts when you need the warning list.</p>`,inspector:`<button class="pill" onclick="openSheet('analyst')">‹ Analyst</button><p>Tap the map to inspect exact values and data time.</p>`};
function openSheet(page){if(current===page){closeSheet();return}current=page;document.getElementById('title').textContent=page[0].toUpperCase()+page.slice(1);document.getElementById('content').innerHTML=page==='alerts'&&previewState==='empty'?'<p>No alerts in view. Warnings remain visible on the map when available.</p>':pages[page];if(page==='search')document.querySelector('input[type=search]')?.focus();document.getElementById('shade').classList.add('show');document.getElementById('sheet').classList.add('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page))}function setPreviewState(v){previewState=v;document.querySelector('.fresh').textContent=({fresh:'● Fresh · 2 min',loading:'◌ Loading radar…',stale:'◆ Stale · last scan 22 min ago',offline:'× Offline · cached scan',empty:'● Fresh · 2 min'})[v];document.querySelector('[data-page=alerts]').innerHTML='<span>♧</span>Alerts '+(v==='empty'?'0':'8');closeSheet()}function closeSheet(){current='';document.getElementById('shade').classList.remove('show');document.getElementById('sheet').classList.remove('show','expanded');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('sel'))}function pick(b){b.classList.toggle('sel')}function day(b,n){if(selectedDay===n&&b.classList.contains('sel')){b.classList.remove('sel');selectedDay=0;return}selectedDay=n;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function enterAnalyst(){mode='analyst';document.getElementById('analyst').classList.add('show');closeSheet();openSheet('analyst')}function exitAnalyst(){mode='radar';document.getElementById('analyst').classList.remove('show');closeSheet()}function pane(n){document.querySelectorAll('#analyst button').forEach((b,i)=>b.classList.toggle('sel',i===n-1))}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script></html>
