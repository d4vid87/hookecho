[workspace]
resolver = "2"
members = [
    "crates/hdf5lite","crates/nexrad-level3", "crates/wxdata", "crates/hookecho"]

# Vendored gribberish 1.5.0 with a one-line fix to its 8-bit PNG unpack (upstream always read a
# u16, overrunning MRMS rotation-track / AzShear grids). See vendor/gribberish/src/templates/
# data_representation/png_template.rs.
# Vendored nexrad-data 1.0.0-rc.7: its reqwest 0.13 forces the `rustls` feature, which on Android
# selects rustls-platform-verifier — that needs a bundled Kotlin CertificateVerifier class our
# hasCode=false NativeActivity APK can't ship (and panics uninitialized). The vendored copy hands
# reqwest a preconfigured webpki-roots TLS config instead (grep `hookecho patch:` in
# vendor/nexrad-data/src/aws/client.rs), matching our main reqwest 0.12. Desktop is unaffected.
# Patched (not a workspace member) so its own tests/benches stay out of --workspace/--all-targets.
[patch.crates-io]
gribberish = { path = "vendor/gribberish" }
nexrad-data = { path = "vendor/nexrad-data" }

# Release builds strip symbols and use fat LTO — wgpu+egui debug info dominates size, and the
# AppImage ships the release binary. `codegen-units = 1` costs build time and buys inlining across
# the whole graph, which matters most on the phone. `panic = "abort"` is deliberately NOT set:
# decode paths guard themselves with `catch_unwind` (wxdata `mrms.rs`, `sounding.rs`, `hrrr.rs`),
# and aborting would turn a bad GRIB message into a crash. Dev builds are untouched.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/d4vid87/hookecho"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
# `process` + `io-util` are for the external-process plugin runner (crates/hookecho/src/plugins.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
# `http2`: tile CDNs all speak h2, and one multiplexed connection beats ~28 TLS handshakes for a
# screenful of tiles. ALPN falls back to HTTP/1.1 where h2 isn't offered.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.12"
directories = "5"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
