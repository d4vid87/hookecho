name: Site

# hookecho.io — the marketing/docs site in site/, deployed to its own Pages project. Separate from
# demo.yml, which deploys the wasm app to the `hookecho` project at app.hookecho.io.
on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "site/**"
      - "docs/shots/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Require successful CI for this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/require-ci.mjs

  deploy:
    needs: verify
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        # The analytics beacon only renders when the token is set, so a fork's build stays clean.
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          npm ci
          npm test
          npm run build

      # Advisory only. These are mostly external links, and a weather agency having a bad morning
      # must not be able to stop a deploy of this site.
      - name: Link check
        continue-on-error: true
        working-directory: site
        run: npm run linkcheck

      - name: Configure CTA analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"deployment_configs":{"production":{"analytics_engine_datasets":{"CTA_ANALYTICS":{"dataset":"hookecho_cta"}}},"preview":{"analytics_engine_datasets":{"CTA_ANALYTICS":{"dataset":"hookecho_cta"}}}}}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hookecho-site" \
            | jq -e '.success == true' >/dev/null

      - name: Verify preview before publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy site/dist --project-name=hookecho-site --branch=verify-${{ github.sha }} | tee /tmp/site-preview.log
          url=$(grep -oE 'https://[0-9a-f]+\.hookecho-site\.pages\.dev' /tmp/site-preview.log | tail -1)
          test -n "$url"
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "$url/" -o /tmp/site-preview.html
          grep -qi '<html' /tmp/site-preview.html

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          npx --yes wrangler@3 pages deploy site/dist --project-name=hookecho-site --branch=main
