name: Feed contracts

on:
  schedule:
    - cron: "23 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public NOAA prefixes
        run: scripts/feed-contracts.sh
      - name: Capture cross-source valid times
        run: |
          python3 scripts/cross-source-capture.py --self-test
          python3 scripts/cross-source-capture.py cross-source-capture.json
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-timing-${{ github.run_id }}
          path: cross-source-capture.json
          if-no-files-found: warn
          retention-days: 30
