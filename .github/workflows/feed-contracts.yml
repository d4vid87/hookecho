name: Feed contracts

on:
  push:
    branches: [roadmap/foundation]
  schedule:
    - cron: "23 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public NOAA prefixes
        run: scripts/feed-contracts.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Decode same-cycle HRRR station temperatures
        run: cargo test -p wxdata --lib live_hrrr_station_temperature_uses_one_cycle -- --ignored
      - name: Decode recent RTMA station temperatures
        run: cargo test -p wxdata --lib live_station_temperature_history_keeps_exact_hours -- --ignored
      - name: Sample native RTMA analysis at a point and nearby station
        run: cargo test -p wxdata --lib live_native_pair_reads_exact_analysis_hour -- --ignored
      - name: Derive native-grid RTMA equivalent potential temperature
        run: cargo test -p wxdata --lib live_theta_e_uses_matching_native_surface_fields -- --ignored
      - name: Decode same-cycle GFS station temperatures
        run: cargo test -p wxdata --lib live_gfs_station_temperature_includes_prior_analyses -- --ignored
      - name: Capture cross-source valid times
        run: |
          python3 scripts/cross-source-capture.py --self-test
          python3 scripts/cross-source-capture.py cross-source-capture.json
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-timing-${{ github.run_id }}
          path: cross-source-capture.json
          if-no-files-found: warn
          retention-days: 30
