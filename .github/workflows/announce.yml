name: Announce

# Stable HookEcho releases use the same publisher as scheduled and WeatherDesk campaigns. The tag
# event is retained because releases created by GITHUB_TOKEN do not trigger release workflows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to announce
        required: true
      dry_run:
        description: Build and print without posting
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  PROMOTION_PAUSES: ${{ vars.PROMOTION_PAUSES }}
  BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
  BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
  MASTODON_URL: ${{ secrets.MASTODON_URL }}
  MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  YOUTUBE_HOOKECHO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_HOOKECHO_REFRESH_TOKEN }}
  YOUTUBE_PUBLIC_UPLOADS: ${{ vars.YOUTUBE_PUBLIC_UPLOADS }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
  META_HOOKECHO_PAGE_ID: ${{ secrets.META_HOOKECHO_PAGE_ID }}
  META_HOOKECHO_PAGE_TOKEN: ${{ secrets.META_HOOKECHO_PAGE_TOKEN }}
  META_HOOKECHO_IG_USER_ID: ${{ secrets.META_HOOKECHO_IG_USER_ID }}
  META_HOOKECHO_IG_TOKEN: ${{ secrets.META_HOOKECHO_IG_TOKEN }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Wait for the release to exist
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::release $TAG never appeared (30 min)"
          exit 1
      - name: Test promotion logic
        run: node --test scripts/announce/promotion.test.mjs
      - name: Prepare release campaign
        run: node scripts/announce/post.mjs prepare-release campaign.json hookecho "${{ steps.tag.outputs.value }}" CHANGELOG.md
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render vertical video
        run: scripts/announce/render-social.sh campaign.json social.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: release-promotion-${{ github.run_id }}
          path: |
            campaign.json
            social.mp4
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [bluesky, mastodon, discord, youtube, facebook, instagram]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "release-promotion-${{ github.run_id }}" }
      - id: post
        continue-on-error: true
        run: node scripts/announce/post.mjs publish campaign.json "${{ matrix.channel }}" social.mp4
      - name: Save success marker
        if: steps.post.outputs.posted == 'true'
        run: echo "${{ steps.post.outputs.marker }}" > promotion-marker.txt
      - uses: actions/upload-artifact@v4
        if: steps.post.outputs.posted == 'true'
        with:
          name: ${{ steps.post.outputs.marker }}
          path: promotion-marker.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.post.outcome == 'failure'
        with:
          name: ${{ steps.post.outputs.failure_marker }}
          path: promotion-failure.txt
          retention-days: 14
      - name: Notify and fail
        if: steps.post.outcome == 'failure'
        run: |
          node scripts/announce/post.mjs notify "Release announcement failed for ${{ matrix.channel }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
