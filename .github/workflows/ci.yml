name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # eframe/rodio need ALSA + windowing dev headers on Linux; Windows uses native backends.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libgtk-3-dev

      # Hard gates: the tree builds warning-free and the offline unit tests pass on both OSes.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The website ships a committed copy of the NEXRAD site table (its build has no Rust), so
      # check it still matches the registry.
      - name: Site table up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -q -p wxdata --example nexrad_sites > /tmp/nexrad-sites.json
          diff -u site/src/data/nexrad-sites.json /tmp/nexrad-sites.json

      # Advisory: clippy lints are surfaced but don't fail the build (the tree is tuned for a
      # custom hand-format, and some pedantic lints are intentionally left).
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  # Same idea for the browser build: catch a native-only dep (or an ungated std::thread/fs call)
  # leaking into the wasm target. Library only — the binary is desktop-only by design.
  wasm-check:
    name: Web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # getrandom 0.3 picks its browser backend from this cfg, not from a feature alone.
      - name: Check
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo check --target wasm32-unknown-unknown -p hookecho --lib

  # And the part `cargo check` structurally cannot see: whether the thing runs. A wasm build can
  # compile clean and panic on its first frame (0.6.0 shipped exactly that), so this builds the
  # real bundle, serves it, and opens it in headless Chrome.
  web-smoke:
    name: Web smoke (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      # Without this, build.sh skips wasm-opt with a warning and the size gate measures a bundle
      # nobody ships.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the bundle
        run: scripts/web/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install puppeteer
        run: npm install --no-save puppeteer@23

      # `python3 -m http.server` serves .wasm as application/wasm, which is what the streaming
      # instantiate in the bundle needs.
      - name: Serve and open
        run: |
          python3 -m http.server 8080 --directory web &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          node scripts/web/smoke.mjs http://127.0.0.1:8080/

  # Golden-image test for the wgpu radar pipeline. Runs on the software rasterizer
  # (mesa lavapipe) via HOOKECHO_GPU_FALLBACK=1 so the render is deterministic across
  # machines — the checked-in golden is authored under lavapipe too. If the golden is
  # ever missing, the test skips and writes the actual PNG; grab it from the artifact
  # below and check it in as crates/hookecho/tests/golden/snapshot_base.png.
  gpu-golden:
    name: GPU golden (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev libgtk-3-dev

      - name: Golden test
        env:
          HOOKECHO_GPU_FALLBACK: "1"
        run: cargo test -p hookecho -- --ignored gpu --nocapture

      - name: Upload actual render
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-golden-actual
          path: target/*.png
          if-no-files-found: ignore

  # Cross-compile the Android cdylib so platform-gating rot (a desktop-only dep leaking into the
  # Android build) is caught on every PR without a device. Builds the .so only — no APK/Gradle.
  android-check:
    name: Android cdylib (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libhookecho.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --lib -p hookecho

      # The Android linker defers unresolved symbols to dlopen — a missing C++ runtime links
      # "successfully" here and then crashes instantly on-device (UnsatisfiedLinkError:
      # __cxa_pure_virtual). Fail the build if any dlopen-time C++ runtime symbol is dangling.
      - name: Verify no unresolved C++ runtime symbols
        run: |
          SO=target/aarch64-linux-android/debug/libhookecho.so
          if nm -D --undefined-only "$SO" | grep -E '__cxa_(pure_virtual|throw|guard)|__gxx_personality|_ZNSt|_Znwm|_ZdlPv'; then
            echo "::error::unresolved C++ runtime symbols in $SO — libc++ static link is broken"
            exit 1
          fi
