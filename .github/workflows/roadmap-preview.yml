name: Roadmap preview

on:
  push:
    branches: ["roadmap/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web bundle and isolated preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: |
          version="$(sed -n '/^name = "wasm-bindgen"$/,/^$/s/^version = "\(.*\)"/\1/p' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Install binaryen
        run: bash scripts/web/install-binaryen.sh
      - name: Build
        run: scripts/web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hookecho-web-${{ github.sha }}
          path: web/
          retention-days: 14
      - name: Deploy non-production Cloudflare preview
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="preview-${GITHUB_SHA::12}"
          npx --yes wrangler@3 pages deploy web --project-name=hookecho --branch="$branch"

  native:
    name: Linux preview artifact
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libgtk-3-dev
      - name: Build AppImage
        run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hookecho-linux-${{ github.sha }}
          path: dist/HookEcho-x86_64.AppImage
          retention-days: 14
