name: Demo

# The public browser demo, rebuilt from main on every push. It is the primary link in every
# announcement, so it tracks the rolling `latest` build rather than the last tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The proxy allowlist exists twice — in the native server and in the Pages Worker — and a
      # feed added to one and not the other is a demo that silently stops drawing something.
      - name: Check the proxy allowlist has not drifted
        run: |
          hosts() { awk '/^(export )?const ALLOWED_HOSTS/,/^\];?$/' "$1" | grep -oE '"[a-z0-9.-]+\.[a-z]+"' | sort; }
          diff <(hosts crates/hookecho/src/serve.rs) <(hosts web/_worker.js/proxy-core.js) || {
            echo "::error::ALLOWED_HOSTS differs between serve.rs and web/_worker.js/proxy-core.js"
            exit 1
          }

      - name: Install Rust (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      # build.sh runs wasm-opt when it is on PATH and warns when it is not; the deployed bundle
      # should always be the optimized one.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the bundle
        run: scripts/web/build.sh

      # `web/` is the deploy directory: index.html, dist/ and _worker.js, which Pages picks up as
      # advanced mode and puts in front of every request.
      # ponytail: Pages hard-fails on files over 25 MiB; the wasm is 12.6 MB today.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy web --project-name=hookecho --branch=main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install puppeteer
        run: npm install --no-save puppeteer@23

      # A fresh deployment answers 522 for the wasm for a few seconds before the asset is live,
      # which the smoke test would otherwise read as a broken build.
      # The wasm filename is content-hashed, so ask the built index.html which one this deploy
      # expects rather than guessing — a stale name here would poll a 404 for two minutes.
      - name: Wait for the bundle to be served
        run: |
          asset=$(grep -o 'dist/hookecho_bg-[0-9a-f]*\.wasm' web/index.html | head -1)
          echo "waiting for /$asset"
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hookecho.pages.dev/$asset")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::wasm never became available (last status $code)"
          exit 1

      # The same boot check CI runs against a local server, now against the deployed origin.
      - name: Smoke-test the deployed demo
        run: node scripts/web/smoke.mjs https://hookecho.pages.dev/ --expect-loop

      # The lite viewer is a separate page with its own wasm; it boots without WebGL, so a failure
      # here is its own decode or projection, not the GPU.
      - name: Smoke-test the lite viewer
        run: |
          asset=$(grep -o 'dist/lite-[0-9a-f]*\.js' web/lite/index.html | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://hookecho.pages.dev/$asset")" = 200
          node scripts/web/smoke-lite.mjs https://hookecho.pages.dev/lite/

      - name: Check the proxy answers and refuses
        run: |
          curl -sf "https://hookecho.pages.dev/proxy/api.weather.gov/alerts/active/count" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' https://hookecho.pages.dev/proxy/evil.example/x)" = 403

      # A proxied response has to be cacheable and revalidatable, or every repeat poll pays for
      # the whole body again. The two calls land inside the 15 s edge TTL, so the second sees the
      # same cached upstream response — which is the point: the 304 is answered at the edge.
      - name: Check the proxy caches and revalidates
        run: |
          url="https://hookecho.pages.dev/proxy/api.weather.gov/alerts/active/count"
          curl -sD - -o /dev/null "$url" | tr -d '\r' > /tmp/h.txt
          grep -qi '^cache-control: public, max-age=15$' /tmp/h.txt
          etag=$(grep -i '^etag:' /tmp/h.txt | cut -d' ' -f2-)
          test -n "$etag"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$url")
          test "$code" = 304
