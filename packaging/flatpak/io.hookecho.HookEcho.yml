# Flatpak manifest.
#
# Built from source, not from the AppImage: Flathub rejects repackaged binaries, and the AppImage
# leans on the host's Wayland/X11 and portal sockets anyway — which is exactly what the sandbox
# gives it back through the finish-args below.
#
# The cargo sources file is generated, not hand-written; a Flatpak build has no network, so every
# crate has to be listed as a source. Regenerate it after any Cargo.lock change with:
#
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
#
# (from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)
app-id: io.hookecho.HookEcho
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hookecho

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/hookecho/cargo

finish-args:
  # A radar viewer with no network is a picture of nothing.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Alert sounds and spoken warnings.
  - --socket=pulseaudio
  # The tray icon (StatusNotifier) and the screen-lock inhibitor while chasing.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Imports and exports go through the portal, so no filesystem access is granted here. gpsd is a
  # TCP client, which --share=network already covers.

modules:
  - name: hookecho
    buildsystem: simple
    build-options:
      env:
        # Offline: the sources below are the whole dependency set.
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release -p hookecho
      - install -Dm755 target/release/hookecho /app/bin/hookecho
      - install -Dm644 packaging/hookecho.desktop /app/share/applications/io.hookecho.HookEcho.desktop
      # flatpak-builder only exports files under /app/share whose name starts with the app id, so
      # the desktop file and the icons are installed as `io.hookecho.HookEcho`. Every other
      # packager installs them as plain `hookecho`, which is what the committed copies say — so
      # the two id references inside them are rewritten here rather than renamed repo-wide.
      - sed -i 's|^Icon=hookecho$|Icon=io.hookecho.HookEcho|'
        /app/share/applications/io.hookecho.HookEcho.desktop
      - install -Dm644 packaging/io.hookecho.HookEcho.metainfo.xml
        /app/share/metainfo/io.hookecho.HookEcho.metainfo.xml
      - sed -i 's|<launchable type="desktop-id">hookecho.desktop</launchable>|<launchable
        type="desktop-id">io.hookecho.HookEcho.desktop</launchable>|'
        /app/share/metainfo/io.hookecho.HookEcho.metainfo.xml
      # Icons are drawn by the binary that was just built, one per size.
      - for px in 48 64 128 256 512; do
        mkdir -p /app/share/icons/hicolor/${px}x${px}/apps;
        /app/bin/hookecho --headless-icon
        /app/share/icons/hicolor/${px}x${px}/apps/io.hookecho.HookEcho.png ${px};
        done
    sources:
      - type: dir
        path: ../..
        # A `dir` source is copied wholesale, and an everyday checkout has a multi-gigabyte
        # `target/` in it. None of these are build inputs.
        skip:
          - target
          - web/dist
          - android/app/build
          - android/.gradle
          - .git
      - cargo-sources.json
