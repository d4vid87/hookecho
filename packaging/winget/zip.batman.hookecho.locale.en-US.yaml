ShortDescription: Advanced NEXRAD weather radar viewer
Description: |-
  A desktop radar viewer that talks straight to the public NEXRAD, MRMS, HRRR and NWS feeds from
  your own machine: no account, no hosted service, no telemetry. Level 2 volumes at every tilt
  with dual-polarization products, the national MRMS mosaic and its severe layers, warnings and
  surface observations over an interactive basemap, Skew-T soundings, archive playback to 1991,
  and offline chase packs.
