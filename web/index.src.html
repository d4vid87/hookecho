<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>HookEcho</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101014" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The wasm is the critical path and it is megabytes: start it in parallel with the module
         graph rather than after it. Without these the browser discovers the wasm only once it has
         parsed and executed the glue, which serializes two large downloads for no reason. -->
    <link rel="modulepreload" href="./dist/hookecho.js" />
    <link rel="preload" href="./dist/hookecho_bg.wasm" as="fetch" type="application/wasm" crossorigin />
    <!-- The first two hosts the app talks to once it is up: basemap tiles, and the live radar
         chunk bucket (the only radar host it reaches cross-origin — volumes go via /proxy). -->
    <link rel="preconnect" href="https://basemap.nationalmap.gov" crossorigin />
    <link rel="preconnect" href="https://unidata-nexrad-level2-chunks.s3.amazonaws.com" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #boot {
        position: absolute; inset: 0; display: grid; place-content: center;
        color: #8a8a95; font: 14px system-ui, sans-serif; text-align: center;
      }
      /* Only ever visible when the browser has said the app is installable, and only for a few
         seconds — it floats over the map, and a permanent button there is a permanent dead zone. */
      #install {
        position: absolute; left: 12px; bottom: 12px; display: none;
        padding: 8px 14px; border: 0; border-radius: 999px; cursor: pointer;
        background: #2b2b36; color: #e6e6ee; font: 13px system-ui, sans-serif;
        box-shadow: 0 2px 10px #0008;
      }
    </style>
  </head>
  <body>
    <canvas id="hookecho"></canvas>
    <div id="boot">Loading HookEcho…</div>
    <button id="install" type="button">Install HookEcho</button>
    <!-- Which radar to open on comes from the edge, and nothing about it depends on the app being
         loaded. Fired here, before the module graph is even parsed, it is almost always already
         resolved by the time Rust asks — the app's opening site costs no round trip at all. -->
    <script>
      globalThis.__geo = fetch("/geo.json").then((r) => r.text()).catch(() => null);
    </script>
    <!-- The app shell offline, and an installable app on Android/desktop Chromium. Registered
         after load so the worker's install never competes with the wasm for bandwidth, and
         skipped on file:// and any insecure origin, where it would only throw. -->
    <script>
      if ("serviceWorker" in navigator) {
        addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("sw:", e));
        });
      }
      // Chromium fires this instead of showing its own install UI; Safari and Firefox never do,
      // which is exactly why the button starts hidden rather than starting shown and hiding.
      addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        const btn = document.getElementById("install");
        btn.style.display = "block";
        setTimeout(() => (btn.style.display = "none"), 15000);
        btn.onclick = async () => {
          btn.style.display = "none";
          e.prompt();
          await e.userChoice;
        };
      });
      addEventListener("appinstalled", () => {
        document.getElementById("install").style.display = "none";
      });
    </script>
    <script type="module">
      import init, { start } from "./dist/hookecho.js";
      const boot = document.getElementById("boot");

      // Compile the wasm once and share the compiled module with the decode worker. A
      // `WebAssembly.Module` is structured-cloneable, so the worker gets a second *instance* —
      // its own heap, its own thread — without a second download or a second compile.
      //
      // What it is for: decoding a Level 2 volume is seconds of bzip2, and on this thread that is
      // seconds of frozen map. See web/decode-worker.js and crates/wxdata/src/wasm_worker.rs.
      const glueUrl = new URL("./dist/hookecho.js", import.meta.url).href;
      const wasmUrl = new URL("./dist/hookecho_bg.wasm", import.meta.url).href;
      const module = await WebAssembly.compileStreaming(fetch(wasmUrl));

      let worker = null;
      const pending = new Map();
      let nextId = 1;

      // Retire the worker for the rest of the session. A wasm trap poisons its heap — every later
      // decode in that instance would fail too — so the honest move is to stop using it and let
      // the app fall back to decoding inline. `"worker unavailable"` is the string wasm_worker.rs
      // reads to tell "use the fallback" apart from "this volume is bad".
      const retire = (why) => {
        console.warn("decode worker retired:", why);
        if (worker) worker.terminate();
        worker = null;
        for (const [, [, reject]] of pending) reject(new Error("worker unavailable"));
        pending.clear();
      };

      try {
        worker = new Worker(new URL("./decode-worker.js", import.meta.url), { type: "module" });
        worker.postMessage({ module, glue: glueUrl });
        worker.onerror = (e) => retire(e.message || "worker error");
        worker.onmessage = (e) => {
          const { id, ok, err } = e.data;
          const entry = pending.get(id);
          if (!entry) return;
          pending.delete(id);
          const [resolve, reject] = entry;
          if (err) reject(new Error(err));
          else resolve(new Uint8Array(ok));
        };
      } catch (e) {
        // No module workers (or a `file://` page). Not fatal — the app decodes inline.
        console.warn("no decode worker:", e);
        worker = null;
      }

      // The bridge wasm_worker.rs looks up. Absent means "decode inline", which is why it is only
      // defined when there is a live worker to talk to.
      globalThis.__decodeVolume = (bytes) => {
        if (!worker) return Promise.reject(new Error("worker unavailable"));
        const id = nextId++;
        return new Promise((resolve, reject) => {
          pending.set(id, [resolve, reject]);
          // Transfer, not copy: the volume is tens of MB and this side is finished with it. Rust
          // hands us a fresh JS-heap array for exactly this reason.
          worker.postMessage({ id, bytes: bytes.buffer }, [bytes.buffer]);
        });
      };

      // A dead map is indistinguishable from a slow one on a blank canvas, and the two ways it
      // dies after a good start are a lost GPU context (driver reset, tab starved of VRAM, laptop
      // waking) and a Rust panic unwinding out of the animation frame. Both leave the last frame
      // painted forever otherwise. Say so, in the same box the loader used.
      const dead = (msg) => {
        const el = boot.isConnected ? boot : document.body.appendChild(boot);
        el.textContent = msg;
      };
      // Reload rather than sit on a dead canvas — but at most once, or a GPU that dies on every
      // boot turns into a reload loop.
      document.getElementById("hookecho").addEventListener("webglcontextlost", (e) => {
        e.preventDefault();
        // Throttle in the URL, not sessionStorage — WebKit blocks storage in third-party
        // iframes, and a throttle that fails open is a reload loop. One reload per navigation.
        const url = new URL(location.href);
        if (url.searchParams.has("relaunched")) {
          dead("Graphics context lost — reload the page.");
          return;
        }
        url.searchParams.append("relaunched", "1");
        location.href = url.href;
      });
      addEventListener("error", (e) => {
        if (String(e.message || "").includes("unreachable")) dead("HookEcho stopped: " + e.message);
      });

      try {
        // The module is already compiled above — hand it over rather than fetching the wasm twice.
        await init({ module_or_path: module });
        await start("hookecho");
        boot.remove();
        // A recovery reload leaves ?relaunched in the URL, which is our one retry spent. 60s of
        // healthy running earns it back.
        if (new URL(location.href).searchParams.has("relaunched")) {
          setTimeout(() => {
            const u = new URL(location.href);
            u.searchParams.delete("relaunched");
            history.replaceState(null, "", u);
          }, 60000);
        }
      } catch (e) {
        // Nearly always one of two things: a browser with neither WebGPU nor WebGL2, or the
        // wasm being served with the wrong MIME type. Say which rather than showing a blank page.
        boot.textContent = "HookEcho failed to start: " + e;
        console.error(e);
      }
    </script>
  </body>
</html>
