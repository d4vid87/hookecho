<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Hook Echo-WX</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #boot {
        position: absolute; inset: 0; display: grid; place-content: center;
        color: #8a8a95; font: 14px system-ui, sans-serif; text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="hookecho"></canvas>
    <div id="boot">Loading Hook Echo-WX…</div>
    <script type="module">
      import init, { start } from "./dist/hookecho.js";
      const boot = document.getElementById("boot");

      // A dead map is indistinguishable from a slow one on a blank canvas, and the two ways it
      // dies after a good start are a lost GPU context (driver reset, tab starved of VRAM, laptop
      // waking) and a Rust panic unwinding out of the animation frame. Both leave the last frame
      // painted forever otherwise. Say so, in the same box the loader used.
      const dead = (msg) => {
        const el = boot.isConnected ? boot : document.body.appendChild(boot);
        el.textContent = msg;
      };
      document.getElementById("hookecho").addEventListener("webglcontextlost", (e) => {
        e.preventDefault();
        dead("Graphics context lost — reload the page.");
      });
      addEventListener("error", (e) => {
        if (String(e.message || "").includes("unreachable")) dead("Hook Echo-WX stopped: " + e.message);
      });

      try {
        await init();
        await start("hookecho");
        boot.remove();
      } catch (e) {
        // Nearly always one of two things: a browser with neither WebGPU nor WebGL2, or the
        // wasm being served with the wrong MIME type. Say which rather than showing a blank page.
        boot.textContent = "Hook Echo-WX failed to start: " + e;
        console.error(e);
      }
    </script>
  </body>
</html>
