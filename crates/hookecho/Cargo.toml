[package]
name = "hookecho"
description = "Hook Echo-WX — advanced NEXRAD weather radar viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The shared library (desktop bin + Android cdylib both build on it). `cdylib` is what Android's
# NativeActivity loads as `libhookecho.so`; `lib` keeps it usable as a normal Rust dependency.
[lib]
name = "hookecho"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "hookecho"
path = "src/main.rs"

# Embeds the Windows icon + version resource (build.rs). Small, and it compiles on every host, so
# it stays an unconditional build-dep rather than a cfg'd one that breaks cross builds.
[build-dependencies]
winresource = "0.1"

[features]
# Frame profiling over TCP (see `profiling.rs`). Off by default — zero cost when not enabled.
profiling = ["dep:puffin", "dep:puffin_http"]

[dependencies]
wxdata = { path = "../wxdata" }
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }
# Base eframe (all platforms); Linux windowing backends are added target-conditionally below so
# Windows/macOS builds don't pull the Linux-only wayland/x11 deps.
# `wgpu_no_default_features` + `default-features = false` on egui-wgpu and wgpu below hand the
# backend choice to us: wgpu's own default turns on every backend for every platform (dx12 and
# metal get compiled into the Linux and Android builds and never run). We union in exactly the
# backends each target can use, further down.
#
# `accesskit` forwards to egui-winit and publishes the widget tree over the platform's
# accessibility API — AT-SPI on Linux, UI Automation on Windows. Without it a screen reader sees
# one opaque canvas, because that is all an egui window is at the OS level.
# `accesskit` is native-only below: eframe 0.35's web runner drops the update on the floor
# ("not currently implemented", eframe/src/web/app_runner.rs), so on wasm it is pure bundle weight.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
# `serde` gives Key/Modifiers/KeyboardShortcut their Serialize/Deserialize impls, which is what
# lets user keybinds live in settings.json.
egui = { version = "0.35", features = ["serde"] }
egui_extras = "0.35"
wgpu = { version = "29", default-features = false, features = ["wgsl", "std"] }
bytemuck.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
# `ico` is added native-only below — it is only ever encoded by `--headless-icon` in main.rs.
# `gif` stays on every target: the loop exporter is compiled (if never usefully run) on the web.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
chrono.workspace = true
# Deep links arrive percent-encoded from browsers and chat clients; reqwest already builds this.
percent-encoding = "2.3"
# `stream` gives `bytes_stream()`, which the weather-radio player reads the live MP3 body from.
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
lru.workspace = true
lyon = "1.0.19"
mvt-reader = "2.4"
geo-types = "0.7"
flate2.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glam = { version = "0.29", features = ["bytemuck"] }
egui-phosphor = "0.13.0"
# Already in the dependency graph (rustls, hyper); named here for the OAuth PKCE challenge.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Everything below is per-target. egui-wgpu carries the winit integration on every native target
# and none on the web, where there is no winit; tokio is a native runtime and simply does not
# build for wasm (the browser's event loop is the runtime there — see `rt.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The archive date picker is native-only. The widget plus its `jiff` date type cost ~120 KB
# gzipped of wasm, which is real money on a first visit for a convenience the web build can
# get from a typed date instead. `default-features = false` keeps jiff's bundled IANA
# timezone database out even here — the app formats a civil date and reads no zone.
egui_extras = { version = "0.35", features = ["datepicker"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
egui-wgpu = { version = "0.35", default-features = false, features = ["winit"] }
tokio.workspace = true
eframe = { version = "0.35", default-features = false, features = ["accesskit"] }
# Audio is native-only in the source already (`audio.rs` and `nwr.rs` are behind
# `cfg(not(wasm32))`), but the deps were not — rodio and symphonia's mp3/vorbis/flac decoders were
# compiling into the browser bundle for nothing.
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
# Already compiled as rodio's mp3 backend; named directly so the weather-radio player can decode a
# live stream, which rodio's own `Decoder` can't (it needs `Seek`).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
# `--headless-icon` (main.rs) is the only ico writer, and there is no bin on the web.
image = { version = "0.25", default-features = false, features = ["ico"] }

# The web build. wgpu's backends are feature-unioned per platform below, and wasm has to name its
# own: without these the browser build compiles and then finds zero adapters at runtime. WebGPU
# where the browser has it, WebGL2 everywhere else — the renderer is written to work on both.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl"] }
egui-wgpu = { version = "0.35", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
# A panic in the browser is otherwise a bare "unreachable executed"; these put the message and the
# app's own logs in the devtools console, which is the only debugger a wasm build has.
console_error_panic_hook = "0.1"
console_log = "1"
# The file-dialog set (HtmlInputElement/FileList/File through Blob/Url/HtmlAnchorElement) is what
# lets `dialog.rs` import and export in a browser — see its `web_open` and `web_save`.
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Location", "Storage", "HtmlAudioElement", "SpeechSynthesis", "SpeechSynthesisUtterance", "HtmlInputElement", "HtmlAnchorElement", "HtmlElement", "CssStyleDeclaration", "Element", "FileList", "File", "Blob", "Url", "Navigator", "Geolocation", "Position", "Coordinates", "PositionError", "PositionOptions", "Notification", "NotificationOptions", "NotificationPermission", "History", "Performance"] }

# Native file dialogs — desktop only. rfd has no Android backend, and Android replaces it with a
# fixed exports dir + Storage-Access-Framework (deferred); see `dialog.rs`.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
# Desktop OS notifications: the banner the OS draws, not the in-app one. No Android or wasm —
# both have their own notification story.
notify-rust = "4"
rfd = "0.15"

# One wgpu backend set per platform, feature-unioned onto the base wgpu above.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["dx12", "vulkan"] }
# Already in the graph via winit; named here for `AttachConsole` and the `CREATE_NO_WINDOW` flag.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["metal"] }
egui-wgpu = { version = "0.35", default-features = false, features = ["macos-window-resize-jitter-fix"] }

# Linux windowing backends (Wayland + X11). Feature-unioned onto the base eframe above, so only
# Linux builds pull them; Windows/macOS use their native winit backends.
# ksni gives a pure-D-Bus StatusNotifier tray icon (KDE/freedesktop) without a GTK loop.
# `default-features = false` is load-bearing: ksni's default pulls `zbus/tokio`, and rfd's file
# dialogs reach the XDG portal over that same zbus with `async-io`. With both executors compiled in,
# zbus picks tokio and every file dialog panicked ("there is no reactor running") because the UI
# thread has no runtime context. Dropping the default leaves one executor and one behaviour.
# Tests only: hand-built Scans for the volume/tilt logic in `view.rs`. wxdata re-exports `Scan`
# but not the constructors a synthetic sweep needs.
[dev-dependencies]
nexrad-model = "1.0.0-rc.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wayland", "x11"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Android: eframe's GameActivity backend + the winit android-activity glue (feature-unioned onto
# the base eframe). `winit` is named directly so `android_main` can take the `AndroidApp` handle;
# its version tracks the one eframe 0.35 pulls (winit 0.30), so the type matches eframe's field.
#
# GameActivity, not NativeActivity: NativeActivity's soft keyboard only delivers raw key events,
# which on a modern IME means ASCII and nothing else — no autocorrect, no suggestion bar, no
# composing region, no non-Latin input. GameActivity carries GameTextInput, which is the real
# system IME. Both lines below MUST name the same backend: `android-activity` refuses to build
# with two backend features enabled, so flipping only one of them is a compile error, not a
# silent fallback.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["android-game-activity"] }
winit = { version = "0.30", features = ["android-game-activity"] }
android_logger = "0.14"
# System clipboard bridge (paste into egui text fields); the soft-keyboard calls go through
# android-activity's built-in helpers instead.
jni = "0.21"

# Debian package (`cargo deb -p hookecho`). Same payload as the AppImage — binary, desktop entry,
# AppStream metainfo, icon — but installed into the system so the distro's own menu, icon cache and
# updater handle it. The icon is rendered by the built binary (`--headless-icon`) into
# `target/deb-assets/`, so no PNG is committed; `packaging/build-deb.sh` does that first.
[package.metadata.deb]
maintainer = "d4vid87 <davidmay87@gmail.com>"
copyright = "2026, Hook Echo-WX contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Hook Echo-WX renders NEXRAD Level II and Level III radar with dual-pol moments, \
storm-relative velocity, derived products, warnings, satellite and lightning — \
locally, with no account and no central server."""
section = "science"
priority = "optional"
depends = "$auto"
assets = [
    ["../../target/release/hookecho", "usr/bin/", "755"],
    ["../../packaging/hookecho.desktop", "usr/share/applications/", "644"],
    ["../../packaging/zip.batman.hookecho.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../target/deb-assets/hookecho-256.png", "usr/share/icons/hicolor/256x256/apps/hookecho.png", "644"],
    ["../../target/deb-assets/hookecho-128.png", "usr/share/icons/hicolor/128x128/apps/hookecho.png", "644"],
]
