[package]
name = "hookecho"
description = "Hook Echo-WX — advanced NEXRAD weather radar viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The shared library (desktop bin + Android cdylib both build on it). `cdylib` is what Android's
# NativeActivity loads as `libhookecho.so`; `lib` keeps it usable as a normal Rust dependency.
[lib]
name = "hookecho"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "hookecho"
path = "src/main.rs"

# Embeds the Windows icon + version resource (build.rs). Small, and it compiles on every host, so
# it stays an unconditional build-dep rather than a cfg'd one that breaks cross builds.
[build-dependencies]
winresource = "0.1"

[features]
# Frame profiling over TCP (see `profiling.rs`). Off by default — zero cost when not enabled.
profiling = ["dep:puffin", "dep:puffin_http"]

[dependencies]
wxdata = { path = "../wxdata" }
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }
# Base eframe (all platforms); Linux windowing backends are added target-conditionally below so
# Windows/macOS builds don't pull the Linux-only wayland/x11 deps.
# `wgpu_no_default_features` + `default-features = false` on egui-wgpu and wgpu below hand the
# backend choice to us: wgpu's own default turns on every backend for every platform (dx12 and
# metal get compiled into the Linux and Android builds and never run). We union in exactly the
# backends each target can use, further down.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
# `serde` gives Key/Modifiers/KeyboardShortcut their Serialize/Deserialize impls, which is what
# lets user keybinds live in settings.json.
egui = { version = "0.35", features = ["serde"] }
egui_extras = "0.35"
wgpu = { version = "29", default-features = false, features = ["wgsl", "std"] }
bytemuck.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico"] }
chrono.workspace = true
# `stream` gives `bytes_stream()`, which the weather-radio player reads the live MP3 body from.
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
lru.workspace = true
lyon = "1.0.19"
mvt-reader = "2.4"
geo-types = "0.7"
flate2.workspace = true
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
# Already compiled as rodio's mp3 backend; named directly so the weather-radio player can decode a
# live stream, which rodio's own `Decoder` can't (it needs `Seek`).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glam = { version = "0.29", features = ["bytemuck"] }
egui-phosphor = "0.13.0"
# Already in the dependency graph (rustls, hyper); named here for the OAuth PKCE challenge.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Everything below is per-target. egui-wgpu carries the winit integration on every native target
# and none on the web, where there is no winit; tokio is a native runtime and simply does not
# build for wasm (the browser's event loop is the runtime there — see `rt.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-wgpu = { version = "0.35", default-features = false, features = ["winit"] }
tokio.workspace = true

# The web build. wgpu's backends are feature-unioned per platform below, and wasm has to name its
# own: without these the browser build compiles and then finds zero adapters at runtime. WebGPU
# where the browser has it, WebGL2 everywhere else — the renderer is written to work on both.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl"] }
egui-wgpu = { version = "0.35", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
# A panic in the browser is otherwise a bare "unreachable executed"; these put the message and the
# app's own logs in the devtools console, which is the only debugger a wasm build has.
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }

# Native file dialogs — desktop only. rfd has no Android backend, and Android replaces it with a
# fixed exports dir + Storage-Access-Framework (deferred); see `dialog.rs`.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.15"

# One wgpu backend set per platform, feature-unioned onto the base wgpu above.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["dx12", "vulkan"] }
# Already in the graph via winit; named here for `AttachConsole` and the `CREATE_NO_WINDOW` flag.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["metal"] }
egui-wgpu = { version = "0.35", default-features = false, features = ["macos-window-resize-jitter-fix"] }

# Linux windowing backends (Wayland + X11). Feature-unioned onto the base eframe above, so only
# Linux builds pull them; Windows/macOS use their native winit backends.
# ksni gives a pure-D-Bus StatusNotifier tray icon (KDE/freedesktop) without a GTK loop.
# `default-features = false` is load-bearing: ksni's default pulls `zbus/tokio`, and rfd's file
# dialogs reach the XDG portal over that same zbus with `async-io`. With both executors compiled in,
# zbus picks tokio and every file dialog panicked ("there is no reactor running") because the UI
# thread has no runtime context. Dropping the default leaves one executor and one behaviour.
# Tests only: hand-built Scans for the volume/tilt logic in `view.rs`. wxdata re-exports `Scan`
# but not the constructors a synthetic sweep needs.
[dev-dependencies]
nexrad-model = "1.0.0-rc.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wayland", "x11"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Android: eframe's NativeActivity backend + the winit android-activity glue (feature-unioned onto
# the base eframe). `winit` is named directly so `android_main` can take the `AndroidApp` handle;
# its version tracks the one eframe 0.35 pulls (winit 0.30), so the type matches eframe's field.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"
# System clipboard bridge (paste into egui text fields); the soft-keyboard calls go through
# android-activity's built-in helpers instead.
jni = "0.21"
