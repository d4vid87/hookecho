[package]
name = "wxdata"
description = "Weather radar data acquisition and domain model for Hook Echo-WX"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexrad-level3 = { path = "../nexrad-level3" }
hdf5lite = { path = "../hdf5lite" }
# Vendored via [patch.crates-io] in the workspace Cargo.toml — see the note there. Its HTTP
# client is patched to use webpki-roots TLS so AWS S3 fetches work on Android.
nexrad-data = "1.0.0-rc.7"
nexrad-model = "1.0.0-rc.2"
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
lru.workspace = true
directories.workspace = true
log.workspace = true
geojson = "1.0.0"
# No `jpeg`: that feature pulls openjpeg-sys (a vendored C JPEG2000 codec) for a packing template
# no NOAA product we read uses — MRMS and HRRR are PNG / simple / complex packing.
gribberish = { version = "1.5.0", default-features = false, features = ["png"] }
# Already in the tree under reqwest; used here to run the per-forecast-hour HRRR fetches with
# bounded concurrency instead of one at a time.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono-tz = "0.10"
