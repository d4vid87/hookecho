[package]
name = "wxdata"
description = "Weather radar data acquisition and domain model for Hook Echo-WX"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexrad-level3 = { path = "../nexrad-level3" }
hdf5lite = { path = "../hdf5lite" }
# Vendored via [patch.crates-io] in the workspace Cargo.toml — see the note there. Its HTTP
# client is patched to use webpki-roots TLS so AWS S3 fetches work on Android.
nexrad-data = { version = "1.0.0-rc.7", features = ["parallel"] }
nexrad-model = "1.0.0-rc.2"
anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
lru.workspace = true
directories.workspace = true
log.workspace = true
geojson = "1.0.0"
# Already in the tree under reqwest; used here to run the per-forecast-hour HRRR fetches with
# bounded concurrency instead of one at a time.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
chrono-tz = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
# Already in the lockfile via nexrad-data's `parallel` feature — no new weight. Used on the
# verified hot loops only (MRMS decode/decimate, HRRR regrid, L2 sweep binning). Not on wasm:
# there are no threads there.
rayon = "1.12"
# `jpeg` pulls openjpeg-sys (a vendored C JPEG2000 codec). MRMS and HRRR don't need it — they are
# PNG / simple / complex packing — but the RAP analysis files are JPEG2000 (section 5 template 40),
# so the mesoanalysis source doesn't decode without it. Cost measured before adding it back:
# +363 KB on the release binary, and it cross-compiles for arm64-v8a under the NDK unchanged.
gribberish = { version = "1.5.0", default-features = false, features = ["png", "jpeg"] }

# The web build drops `jpeg`, and with it openjpeg-sys — a vendored C codec that has no business
# in a wasm bundle. The only casualty is the RAP mesoanalysis source, whose GRIB2 files are
# JPEG2000-packed; MRMS and HRRR are PNG/simple/complex packing and decode unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gribberish = { version = "1.5.0", default-features = false, features = ["png"] }
# A browser tab has one thread for everything, so the Level 2 decode (a gzip wrapper around ~130
# bzip2 records, tens of MB of CPU) is run in a Web Worker instead — see `wasm_worker.rs`. The
# worker can only send bytes back, so the decoded `Scan` crosses as postcard; nexrad-model already
# derives Serialize/Deserialize behind its `serde` feature, so no wire types of our own.
nexrad-model = { version = "1.0.0-rc.2", features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Already in the lockfile under eframe/wgpu — `net.rs` needs only the page origin, to point feed
# fetches at the same-origin CORS proxy.
web-sys = { version = "0.3", features = ["Window", "Location"] }
# The browser's only timer. `task::sleep` needs one, and there is no tokio here.
gloo-timers = { version = "0.3", features = ["futures"] }
# Already in the lockfile under eframe. Backs `clock::Instant`: the standard library's panics here.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `start_paused` only, so a test of a fifteen-second wait takes no wall clock.
tokio = { version = "1", features = ["test-util"] }

# Benchmarks for the volume-processing hot paths (`benches/hot_paths.rs`). `default-features =
# false` drops criterion's plotting stack — the numbers are read from the terminal here.
[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "hot_paths"
harness = false
